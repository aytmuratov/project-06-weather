<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>Weather Dashboard</h1>
            <div class="search-box">
                <input type="text" id="cityInput" placeholder="Search city..." autocomplete="off">
                <button id="searchBtn">Search</button>
            </div>
        </header>
        <main>
            <section class="current-weather" id="currentWeather">
                <div class="city-name" id="cityName">New York</div>
                <div class="weather-icon" id="weatherIcon">☀️</div>
                <div class="temperature" id="temperature">24°C</div>
                <div class="description" id="description">Sunny</div>
                <div class="details">
                    <div class="detail"><span>💧 Humidity</span><span id="humidity">45%</span></div>
                    <div class="detail"><span>💨 Wind</span><span id="wind">12 km/h</span></div>
                    <div class="detail"><span>👁️ Visibility</span><span id="visibility">10 km</span></div>
                    <div class="detail"><span>🌡️ Feels Like</span><span id="feelsLike">26°C</span></div>
                </div>
            </section>
            <section class="forecast">
                <h2>5-Day Forecast</h2>
                <div class="forecast-grid" id="forecastGrid"></div>
            </section>
            <section class="hourly">
                <h2>Today's Hourly</h2>
                <div class="hourly-scroll" id="hourlyScroll"></div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
