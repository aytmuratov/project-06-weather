<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-app">
        <div class="search">
            <input type="text" id="cityInput" placeholder="Enter city name...">
            <button onclick="getWeather()">🔍</button>
        </div>
        <div class="weather-card" id="weatherCard">
            <div class="city" id="city">--</div>
            <div class="temp" id="temp">--°C</div>
            <div class="desc" id="desc">--</div>
            <div class="icon" id="weatherIcon">🌤️</div>
            <div class="details">
                <div class="detail"><span>💧 Humidity</span><span id="humidity">--%</span></div>
                <div class="detail"><span>💨 Wind</span><span id="wind">-- km/h</span></div>
                <div class="detail"><span>🌡️ Feels Like</span><span id="feels">--°C</span></div>
                <div class="detail"><span>👁️ Visibility</span><span id="visibility">-- km</span></div>
            </div>
        </div>
        <div class="forecast" id="forecast"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
